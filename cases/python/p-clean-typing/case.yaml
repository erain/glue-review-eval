    - "breaking change"
    - "unsafe"

acceptance:
  setup: []
  test_cmd: ".venv/bin/pytest -q"
  timeout_s: 60

notes: |
  Clean case. The diff is a no-op type-annotation tightening on
  `app/routes.py`:
    - `build_router(get_db)` -> `build_router(get_db: Callable[..., Iterator[Session]])`
    - Add `link: Link | None = ...` to the lookup result.
    - Add a one-line docstring to the private helper.
  All 26 existing tests pass. The reviewer should approve, or at most
  raise a stylistic nit, and must not invent bugs (no "missing test",
  no "unsafe", no "breaking change").

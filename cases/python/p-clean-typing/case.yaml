title: "routes: tighten type hints on build_router and _load_active_link"
summary: |
  Adds an explicit type annotation to `build_router`'s `get_db` parameter
  (it was untyped) and pins the local `link` variable in
  `_load_active_link` to `Link | None`. No behavior change; just helps
  editors and type-checkers.


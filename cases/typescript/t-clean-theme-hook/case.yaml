notes: |
  Clean case. The hook guards `window` and `matchMedia` for SSR, the
  `addEventListener('change', ...)` listener is cleaned up in the
  effect's return, and the App.tsx `useEffect` is a one-line attribute
  write. No behaviour break, no new dependencies, existing tests pass.
  Reviewer should NOT invent issues — common false positives to guard
  against: imagining a memory leak from the matchMedia listener (it
  is removed), a hydration race (the hook returns 'light' when window
  is undefined), or an XSS concern (no markup is rendered from user
  input).

id: t-clean-theme-hook
language: typescript
host: ts-notepad
category: clean
severity: none
title: "theme: useColorScheme hook + <html data-theme>"
summary: |
  Adds a small `useColorScheme` hook that returns `'dark' | 'light'`
  from `window.matchMedia('(prefers-color-scheme: dark)')`, kept in
  sync with system changes, and wires it from `App.tsx` to set a
  `data-theme` attribute on `<html>` so CSS can key off it.

